name: Daily SCTR Master Update

on:
  schedule:
    # 每天香港時間早上 6:00 (即 UTC 22:00) 自動執行
    - cron: '0 22 * * *'
  workflow_dispatch: # 允許你隨時手動撳掣執行

permissions:
  contents: write

jobs:
  update-sctr:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas numpy yfinance
        
    - name: Run SCTR Script
      run: python Update_SCTR_Master.py

    - name: Commit and Push changes
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add SCTR_Master.csv
        git commit -m "Auto-update SCTR_Master.csv [skip ci]" || exit 0
        git push
